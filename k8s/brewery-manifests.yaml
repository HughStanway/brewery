apiVersion: v1
kind: Namespace
metadata:
  name: brewery
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brewery-service-account
  namespace: brewery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brewery-deployer-cluster-role
rules:
  - apiGroups:
      - apps
      - ""
      - batch
      - networking.k8s.io
    resources:
      - deployments
      - statefulsets
      - services
      - ingresses
      - configmaps
      - secrets
      - pods
      - pods/log
      - events
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brewery-deployer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: brewery-deployer-cluster-role
subjects:
  - kind: ServiceAccount
    name: brewery-service-account
    namespace: brewery
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brewery-postgres-pvc
  namespace: brewery
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brewery-artifact-store-pvc
  namespace: brewery
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docker-registry-pvc
  namespace: brewery
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: brewery
  labels:
    app: docker-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-registry
  template:
    metadata:
      labels:
        app: docker-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"
          ports:
            - containerPort: 5000
              hostPort: 5000
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: docker-registry-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: brewery
spec:
  type: ClusterIP
  selector:
    app: docker-registry
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: brewery
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: supply_chain
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brewery-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: brewery-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: brewery
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewery-orchestrator
  namespace: brewery
  labels:
    app: brewery-orchestrator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: brewery-orchestrator
  template:
    metadata:
      labels:
        app: brewery-orchestrator
    spec:
      serviceAccountName: brewery-service-account
      containers:
        - name: brewery
          image: brewery/software-supply-chain-platform:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres.brewery.svc.cluster.local:5432/supply_chain"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brewery-secrets
                  key: POSTGRES_PASSWORD
            - name: ARTIFACT_STORE_PATH
              value: "/mnt/artifact-store"
            - name: BREWERY_AUTH_ENABLED
              value: "false"
            - name: BREWERY_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: brewery-secrets
                  key: BREWERY_GITHUB_WEBHOOK_SECRET
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: artifact-store
              mountPath: /mnt/artifact-store
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: artifact-store
          persistentVolumeClaim:
            claimName: brewery-artifact-store-pvc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: brewery-orchestrator
  namespace: brewery
spec:
  selector:
    app: brewery-orchestrator
  ports:
    - port: 8080
      targetPort: 8080
