apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forwardauth
  namespace: brewery
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local:9091/api/verify?rd=https://auth.bigiron.dev/
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
    trustForwardHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brewery-ingress
  namespace: brewery
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: brewery-authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - brewery.bigiron.dev
      secretName: brewery-bigiron-dev-tls
  rules:
    - host: brewery.bigiron.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brewery-orchestrator
                port:
                  number: 8080
