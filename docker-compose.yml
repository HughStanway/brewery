services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  brewery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
      - DB_URL=jdbc:postgresql://postgres:5432/supply_chain
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - ARTIFACT_STORE_PATH=/mnt/artifact-store
      - BREWERY_AUTH_ENABLED=${BREWERY_AUTH_ENABLED:-false}
      - KOMODO_BASE_URL=${KOMODO_BASE_URL:-http://komodo:9120}
      - KOMODO_API_KEY=${KOMODO_API_KEY:-}
      - KOMODO_API_SECRET=${KOMODO_API_SECRET:-}
    ports:
      - "127.0.0.1:${BREWERY_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - artifact_store:/mnt/artifact-store
      - .:${PWD:-/app/src}:ro
      - brewery_builds:/tmp/brewery-builds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db

  komodo:
    image: moghtech/komodo-core:latest
    restart: unless-stopped
    environment:
      - KOMODO_HOST=${KOMODO_HOST_URL:-http://localhost:9120}
      - KOMODO_DATABASE_ADDRESS=mongo:27017
      - KOMODO_LOCAL_AUTH=true
      - KOMODO_INIT_ADMIN_USERNAME=${KOMODO_ADMIN_USER:-admin}
      - KOMODO_INIT_ADMIN_PASSWORD=${KOMODO_ADMIN_PASS:-admin}
      - KOMODO_TRANSPARENT_MODE=${KOMODO_TRANSPARENT_MODE:-true}
      - KOMODO_ENABLE_NEW_USERS=${KOMODO_ENABLE_NEW_USERS:-true}
    ports:
      - "127.0.0.1:${KOMODO_PORT:-9120}:9120"
    volumes:
      - komodo_data:/config
    depends_on:
      - mongo

  registry:
    image: registry:2
    restart: unless-stopped
    volumes:
      - registry_data:/var/lib/registry

volumes:
  postgres_data:
  artifact_store:
  brewery_builds:
  registry_data:
  komodo_data:
  mongo_data:
