spring:
  application:
    name: brewery-orchestrator-dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supply_chain}
    username: postgres
    password: dev_password
  
  jpa:
    hibernate:
      ddl-auto: update
  
  liquibase:
    enabled: false

logging:
  level:
    root: INFO
    com.homelab.brewery: DEBUG
    org.springframework.web: DEBUG

brewery:
  docker:
    host: ${DOCKER_HOST:unix:///Users/hughstanway/.docker/run/docker.sock}
  artifact-store:
    base-path: ${ARTIFACT_STORE_PATH:/Users/hughstanway/Projects/brewery/artifact-store}
  dependency-resolver:
    scheduler:
      delay-ms: 30000
  cascade:
    scheduler:
      delay-ms: 10000
