spring:
  application:
    name: brewery-orchestrator
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supply_chain}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.yaml
    contexts: ${LIQUIBASE_CONTEXT:prod}
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.homelab.brewery: DEBUG

brewery:
  auth:
    enabled: ${BREWERY_AUTH_ENABLED:true}

  build:
    timeout-seconds: 1800
    max-concurrent-builds: 2
    container-memory: 4g
    container-cpus: 2
  
  artifact-store:
    base-path: ${ARTIFACT_STORE_PATH:/mnt/artifact-store}
    retention-days: ${ARTIFACT_RETENTION_DAYS:90}
  
  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    buildkit-enabled: true
  
  github:
    webhook:
      secret: ${BREWERY_GITHUB_WEBHOOK_SECRET:disabled}
      allowed-events:
        - push
        - pull_request

  deployment:
    komodo:
      base-url: ${KOMODO_BASE_URL:http://komodo:9120}
      api-key: ${KOMODO_API_KEY:}
      api-secret: ${KOMODO_API_SECRET:}

